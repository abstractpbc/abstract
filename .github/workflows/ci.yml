name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: "0.12.24"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group typing
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python examples/fake_arm.py
      - run: uv run --no-sync pytest
      - run: uv build --no-sources
      - run: uv run --no-sync python scripts/check_dist.py dist
      - name: Install wheel in a fresh environment and run outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/harness-wheel"
          uv pip install --python "$RUNNER_TEMP/harness-wheel/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/harness-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: "0.12.24"
          python-version: ${{ matrix.python }}
      # All drivers and cameras are replaced by fakes; no connected rig is used.
      - run: uv sync --locked --extra yam --group yam-driver
      - run: uv run --no-sync pytest

  lerobot-reader:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: "0.12.24"
          python-version: "3.12"
      - run: uv sync --locked --extra robot
      - run: uv pip install 'lerobot[dataset]==0.6.1'
      - run: uv run --no-sync python -c 'import lerobot.datasets.lerobot_dataset'
      - run: uv run --no-sync pytest tests/test_robot_formats.py::test_lerobot_itself_loads_the_dataset -v
